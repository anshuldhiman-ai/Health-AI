# App CI — format, analyze, test, goldens, manifest check, size budget (Section 12.2).
name: app-ci

on:
  push:
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/**"

jobs:
  format-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        uses: flutter-actions/flutter-fvm@v1
        with:
          flutter-version-file: app/.fvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (via FVM)
        run: fvm install && fvm flutter --version

      - name: pub get
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm flutter gen-l10n

      - name: Format check
        run: fvm dart format --set-exit-if-changed .

      - name: Analyze (zero issues)
        run: fvm flutter analyze

  test:
    runs-on: ubuntu-latest
    needs: format-analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        uses: flutter-actions/flutter-fvm@v1
        with:
          flutter-version-file: app/.fvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (via FVM)
        run: fvm install && fvm flutter --version

      - name: pub get
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm flutter gen-l10n

      - name: Unit + widget + architecture + golden tests
        run: fvm flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/

  # Release build + merged-manifest check. Debug builds legitimately
  # contain INTERNET for tooling — NEVER use them as evidence of
  # offline behaviour (Section 7.1).
  release-manifest:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        uses: flutter-actions/flutter-fvm@v1
        with:
          flutter-version-file: app/.fvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (via FVM)
        run: fvm install && fvm flutter --version

      - name: pub get + generate
        run: |
          fvm flutter pub get
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm flutter gen-l10n

      - name: Build release AAB
        run: fvm flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Merged manifest permission check (R1)
        run: ../tools/check_manifest.sh build/app/outputs/bundle/release/app-release.aab

      - name: Size budget
        run: ../tools/size_budget.sh
