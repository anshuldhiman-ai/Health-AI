[project]
name = "health-ai-ml"
version = "0.1.0"
description = "Training and export pipeline for the on-device Indian food classifier (PyTorch -> LiteRT)."
requires-python = ">=3.11"
dependencies = [
  # Core (Section 3.2) — versions pinned by uv.lock, not here.
  # TODO(M0): verify current versions with `uv add` and commit uv.lock.
  "torch>=2.4",
  "timm>=1.0",
  "torchvision>=0.19",
  "albumentations>=1.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  # Tracking (choose ONE: W&B free tier or MLflow; record the choice)
  # "wandb",
  # Data QA
  "imagehash>=4.3",
  "cleanvision>=0.2",
  "cleanlab>=2.6",
  "fiftyone>=0.27",
  # Metrics
  "torchmetrics>=1.5",
  "scikit-learn>=1.5",
  # Quality
  "ruff>=0.7",
  "pytest>=8.3",
  "pyright>=1.1",
  # Config/data files
  "pyyaml>=6.0",
  "tqdm>=4.70.1",
]

[project.optional-dependencies]
# Export toolchain (litert-torch -> litert-converter) has Linux/macOS-only
# wheels, so it is opt-in: training boxes and CI install it with
# `uv sync --extra export`. Windows dev machines run lint/tests without it.
# NOT installed locally on Windows — export runs on Kaggle/Colab/Linux.
export = [
  "litert-torch>=0.1",
  "ai-edge-litert>=0.1",
]

[build-system]
# Makes the src-layout package importable under `uv run` / pytest
# without sys.path hacks (ml_pipeline resolves as a real wheel).
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are exploration-only (CLAUDE.md); cross-cell definitions are
# valid notebook style but violate pipeline-lint checks — excluded.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
