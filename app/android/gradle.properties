org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin compile daemon leaks "Storage is already registered" paged-file
# handles between builds on Windows. In-process compilation avoids the
# daemon entirely; slower but reliable. Remove if a Kotlin release fixes it.
# (Two property names: KGP 2.x build-tools API reads the second one.)
kotlin.compiler.execution.strategy=in-process
kotlin.buildtools.execution.strategy=in-process
# No incremental caches -> no "Could not close incremental caches" /
# "Storage is already registered" daemon/cache failures on Windows.
kotlin.incremental=false
android.enableR8.fullMode=false
