[project]
name = "health-ai-ml"
version = "0.1.0"
description = "Training and export pipeline for the on-device Indian food classifier (PyTorch -> LiteRT)."
requires-python = ">=3.11"
dependencies = [
  # Core (Section 3.2) — versions pinned by uv.lock, not here.
  # TODO(M0): verify current versions with `uv add` and commit uv.lock.
  "torch>=2.4",
  "timm>=1.0",
  "torchvision>=0.19",
  "albumentations>=1.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  # Tracking (choose ONE: W&B free tier or MLflow; record the choice)
  # "wandb",
  # Data QA
  "imagehash>=4.3",
  "cleanvision>=0.2",
  "cleanlab>=2.6",
  "fiftyone>=0.27",
  # Metrics
  "torchmetrics>=1.5",
  "scikit-learn>=1.5",
  # Export (LiteRT)
  "litert-torch>=0.1",
  "ai-edge-litert>=0.1",
  # Quality
  "ruff>=0.7",
  "pytest>=8.3",
  "pyright>=1.1",
]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
